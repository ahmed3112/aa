<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصحف الكامل | Ramadan Kareem</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Cairo',sans-serif;
  background:#0b1c2d;
  color:white;
  transition:0.3s;
}

header{
  text-align:center;
  padding:60px 20px;
  background:linear-gradient(135deg,#0b1c2d,#102c44);
}

h1{color:#f4c430}

.card{
  background:#162f4a;
  margin:20px auto;
  padding:25px;
  border-radius:15px;
  max-width:1000px;
}

select,button{
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
  font-family:'Cairo';
}

button{
  background:#f4c430;
  font-weight:bold;
  cursor:pointer;
}

button:hover{opacity:0.8}

#ayahContainer{
  margin-top:20px;
  line-height:2.2;
  font-size:20px;
}

audio{
  margin-top:20px;
  width:100%;
}

.toggle{
  position:fixed;
  top:15px;
  left:15px;
  background:#f4c430;
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
}

.light{
  background:#f5f5f5;
  color:black;
}

.light .card{
  background:white;
  color:black;
}
</style>
</head>

<body>

<div class="toggle" onclick="toggleMode()">🌙 / ☀</div>

<header>
  <h1>🌙 رمضان كريم</h1>
  <h2>المصحف الكامل بالصوت</h2>
</header>

<section class="card">

<div style="text-align:center">
  <select id="reciterSelect"></select>
  <select id="surahSelect"></select>
  <button onclick="loadSurah()">عرض السورة</button>
  <button onclick="downloadSurah()">تحميل السورة</button>
</div>

<div id="ayahContainer"></div>

<audio id="audio" controls></audio>

</section>

<script>
const reciters=[
{name:"مشاري العفاسي",id:"ar.alafasy"},
{name:"السديس",id:"ar.abdurrahmaansudais"},
{name:"ماهر المعيقلي",id:"ar.mahermuaiqly"}
];

const reciterSelect=document.getElementById("reciterSelect");
const surahSelect=document.getElementById("surahSelect");
const ayahContainer=document.getElementById("ayahContainer");
const audio=document.getElementById("audio");

reciters.forEach(r=>{
let o=document.createElement("option");
o.value=r.id;
o.textContent=r.name;
reciterSelect.appendChild(o);
});

fetch("https://api.alquran.cloud/v1/surah")
.then(res=>res.json())
.then(data=>{
data.data.forEach(s=>{
let o=document.createElement("option");
o.value=s.number;
o.textContent=s.number+" - "+s.name;
surahSelect.appendChild(o);
});
});

function loadSurah(){
let surah=surahSelect.value;
let reciter=reciterSelect.value;

fetch(`https://api.alquran.cloud/v1/surah/${surah}`)
.then(res=>res.json())
.then(data=>{
ayahContainer.innerHTML="";
data.data.ayahs.forEach(a=>{
let p=document.createElement("p");
p.innerHTML=a.text+" ("+a.numberInSurah+")";
p.onclick=()=>playAyah(surah,a.numberInSurah);
ayahContainer.appendChild(p);
});
});

audio.src=`https://cdn.islamic.network/quran/audio-surah/128/${reciter}/${surah}.mp3`;
audio.play();
}

function playAyah(surah,ayah){
let reciter=reciterSelect.value;
let formattedAyah=String(ayah).padStart(3,'0');
let formattedSurah=String(surah).padStart(3,'0');
audio.src=`https://cdn.islamic.network/quran/audio/128/${reciter}/${formattedSurah}${formattedAyah}.mp3`;
audio.play();
}

function downloadSurah(){
let surah=surahSelect.value;
let reciter=reciterSelect.value;
let link=`https://cdn.islamic.network/quran/audio-surah/128/${reciter}/${surah}.mp3`;
window.open(link,'_blank');
}

function toggleMode(){
document.body.classList.toggle("light");
}
</script>

</body>
</html>
