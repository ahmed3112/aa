<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FleetFlow | نظام إدارة أسطول وحجوزات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <h1>FleetFlow</h1>
        <p>نظام ويب متكامل لإدارة الأسطول، حجوزات الذهاب/الذهاب والعودة، وإرسال بيانات السائق.</p>
      </div>
    </header>

    <main class="layout">
      <section class="card booking-card">
        <h2>طلب حجز جديد</h2>
        <form id="bookingForm" novalidate>
          <div class="grid two">
            <label>
              <span>اسم مقدم الطلب</span>
              <input id="requesterName" required placeholder="مثال: Ahmed Ali" />
            </label>

            <label>
              <span>بريد مقدم الطلب</span>
              <input id="requesterEmail" type="email" required placeholder="requester@company.com" />
            </label>
          </div>

          <div class="grid two">
            <label>
              <span>نوع الرحلة</span>
              <select id="tripType" required>
                <option value="one-way">ذهاب فقط</option>
                <option value="round-trip">ذهاب وعودة</option>
              </select>
            </label>

            <label>
              <span>عدد الركاب</span>
              <input id="passengers" type="number" min="1" max="20" required value="1" />
            </label>
          </div>

          <div class="grid two">
            <label>
              <span>نقطة الانطلاق</span>
              <input id="pickup" required placeholder="موقع الانطلاق" />
            </label>

            <label>
              <span>الوجهة</span>
              <input id="dropoff" required placeholder="الوجهة" />
            </label>
          </div>

          <div class="grid three">
            <label>
              <span>تاريخ الرحلة</span>
              <input id="tripDate" type="date" required />
            </label>

            <label>
              <span>وقت الانطلاق</span>
              <input id="tripTime" type="time" required />
            </label>

            <label id="returnGroup" hidden>
              <span>وقت العودة</span>
              <input id="returnTime" type="time" />
            </label>
          </div>

          <label>
            <span>ملاحظات إضافية</span>
            <textarea id="notes" rows="3" placeholder="أي تعليمات مهمة للسائق أو فريق التشغيل"></textarea>
          </label>

          <div class="actions">
            <button class="primary" type="submit">إضافة الطلب</button>
            <button id="clearBtn" type="button">مسح كل الطلبات</button>
          </div>
          <p id="formMessage" class="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="card driver-card">
        <h2>تعيين السائق والمركبة</h2>
        <p class="muted">اختر السائق المناسب لكل طلب ثم أرسل بريد جاهز لمقدم الطلب يتضمن بيانات السائق.</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>رقم الطلب</th>
                <th>مقدم الطلب</th>
                <th>المسار</th>
                <th>موعد الرحلة</th>
                <th>السائق</th>
                <th>إجراء</th>
              </tr>
            </thead>
            <tbody id="bookingRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <template id="rowTemplate">
      <tr>
        <td class="cell-id"></td>
        <td class="cell-requester"></td>
        <td class="cell-route"></td>
        <td class="cell-schedule"></td>
        <td>
          <select class="driver-select"></select>
        </td>
        <td class="cell-actions"></td>
      </tr>
    </template>

    <script src="script.js" defer></script>
  </body>
</html>
