<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:"Cairo",sans-serif;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  min-height:100vh;
}

header{
  background:#fff;
  padding:15px;
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
}

button,select,input{
  padding:6px 12px;
  border-radius:8px;
  border:1px solid #ddd;
  cursor:pointer;
}

button{
  background:#0f766e;
  color:#fff;
  border:none;
}

.wrapper{
  display:flex;
  justify-content:center;
  margin:40px 20px;
}

.mushaf-frame{
  max-width:950px;
  width:100%;
  background:#fdfaf3;
  border-radius:25px;
  padding:35px;
  position:relative;
  border:10px solid #d4af37;
  box-shadow:0 40px 80px rgba(0,0,0,0.4);
}

.mushaf-frame::before{
  content:"";
  position:absolute;
  top:15px;left:15px;right:15px;bottom:15px;
  border:3px solid #c9a227;
  border-radius:18px;
}

.page-title{
  text-align:center;
  font-weight:700;
  font-size:18px;
}

.surah-name{
  text-align:center;
  font-weight:600;
  margin-top:5px;
}

.juz-name{
  text-align:center;
  font-size:14px;
  color:#666;
  margin-bottom:10px;
}

.basmala{
  text-align:center;
  font-family:"Amiri Quran",serif;
  font-size:28px;
  margin-bottom:25px;
}

.quran-text{
  font-family:"Amiri Quran",serif;
  font-size:30px;
  line-height:2.4;
  text-align:justify;
}

.ayah{
  cursor:pointer;
  padding:4px;
  border-radius:6px;
}

.ayah:hover{background:#f3e8c9}
.ayah.active{background:#fde68a}

.page-number{
  text-align:center;
  margin-top:25px;
  font-weight:600;
}
</style>
</head>

<body>

<header>
<button onclick="prevPage()">⮕ السابقة</button>
<input type="number" id="pageInput" min="1" max="604" value="1">
<button onclick="goToPage()">اذهب</button>
<button onclick="nextPage()">التالية ⮔</button>
</header>

<div class="wrapper">
<div class="mushaf-frame">

<div class="page-title" id="pageTitle"></div>
<div class="surah-name" id="surahName"></div>
<div class="juz-name" id="juzName"></div>
<div class="basmala" id="basmala"></div>

<div class="quran-text" id="quranText"></div>
<div class="page-number" id="pageNumber"></div>

</div>
</div>

<script>
let currentPage=1;
const quranText=document.getElementById("quranText");
const surahName=document.getElementById("surahName");
const juzName=document.getElementById("juzName");
const basmala=document.getElementById("basmala");
const pageTitle=document.getElementById("pageTitle");
const pageNumber=document.getElementById("pageNumber");
const pageInput=document.getElementById("pageInput");

function loadPage(){
 pageInput.value=currentPage;

 fetch(`https://api.alquran.cloud/v1/page/${currentPage}/quran-uthmani`)
 .then(r=>r.json())
 .then(data=>{
  quranText.innerHTML="";
  basmala.innerHTML="";

  const ayahs=data.data.ayahs;
  const first=ayahs[0];

  pageTitle.innerText="الصفحة "+currentPage;
  pageNumber.innerText=currentPage+" / 604";

  // إزالة التكرار
  surahName.innerText=first.surah.name;

  juzName.innerText="الجزء "+first.juz;

  let ayahList=[...ayahs];

  // معالجة البسملة
  if(first.numberInSurah===1 && first.surah.number!==9){
   basmala.innerText="بِسْمِ ٱللّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ";

   // إزالة البسملة من أول آية
   ayahList[0].text=ayahList[0].text.replace("بِسْمِ ٱللّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ","");
  }

  ayahList.forEach(a=>{
   let span=document.createElement("span");
   span.classList.add("ayah");
   span.innerHTML=a.text.trim()+" ﴿"+a.numberInSurah+"﴾ ";
   quranText.appendChild(span);
  });

 });
}

function nextPage(){if(currentPage<604){currentPage++;loadPage();}}
function prevPage(){if(currentPage>1){currentPage--;loadPage();}}
function goToPage(){currentPage=parseInt(pageInput.value);loadPage();}

loadPage();
</script>

</body>
</html>
