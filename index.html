<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصحف الشريف 604 صفحة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#0b1c2d;
font-family:'Cairo',sans-serif;
color:white;
text-align:center;
transition:.3s;
}

header{
padding:20px;
background:linear-gradient(135deg,#0b1c2d,#102c44);
font-size:22px;
}

.container{
margin:20px auto;
max-width:1000px;
background:#162f4a;
padding:20px;
border-radius:15px;
box-shadow:0 0 25px rgba(0,0,0,.6);
}

.frame{
background:black;
padding:15px;
border-radius:15px;
display:inline-block;
}

.frame img{
width:100%;
max-width:900px;
border-radius:10px;
}

.controls{
margin:15px 0;
}

button,select{
padding:8px 15px;
margin:5px;
border:none;
border-radius:8px;
font-family:'Cairo';
}

button{
background:#f4c430;
font-weight:bold;
cursor:pointer;
}

button:hover{opacity:.85}

audio{
margin-top:15px;
width:95%;
max-width:650px;
}

.page-info{
margin-top:10px;
font-size:18px;
}

.prayer-box{
margin-top:25px;
padding:15px;
background:#203c5c;
border-radius:10px;
}
</style>
</head>

<body>

<header>
📖 المصحف الشريف – 604 صفحة كاملة
</header>

<div class="container">

<div class="controls">
<select id="reciter">
<option value="Alafasy_128kbps">مشاري العفاسي</option>
<option value="Abdurrahmaan_As-Sudais_128kbps">السديس (الحرم)</option>
<option value="Maher_AlMuaiqly_128kbps">ماهر المعيقلي (الحرم)</option>
<option value="Husary_128kbps">الحصري (مصر)</option>
<option value="Minshawy_Murattal_128kbps">المنشاوي (مصر)</option>
</select>

<button onclick="prevPage()">⬅ السابق</button>
<button onclick="nextPage()">التالي ➡</button>
<button onclick="playSurah()">🔊 تشغيل</button>
</div>

<div class="frame">
<img id="moshafPage">
</div>

<div class="page-info">
الصفحة: <span id="pageNumber">1</span> / 604
</div>

<audio id="audioPlayer" controls></audio>

<div class="prayer-box">
<h3>🕌 مواعيد الصلاة</h3>
<div id="prayerTimes">جاري تحميل المواقيت...</div>
</div>

</div>

<script>

let currentPage = 1;
const totalPages = 604;
const img = document.getElementById("moshafPage");
const pageNumber = document.getElementById("pageNumber");
const audio = document.getElementById("audioPlayer");

function loadPage(){
let formatted = String(currentPage).padStart(3,'0');
img.src = `https://raw.githubusercontent.com/quran/quran.com-images/master/Pages/page${formatted}.png`;
pageNumber.textContent = currentPage;
localStorage.setItem("lastPage",currentPage);
}

function nextPage(){
if(currentPage < totalPages){
currentPage++;
loadPage();
}
}

function prevPage(){
if(currentPage > 1){
currentPage--;
loadPage();
}
}

// تشغيل السورة حسب الصفحة (تقريب ذكي)
function playSurah(){
let reciter=document.getElementById("reciter").value;
let surah=Math.ceil(currentPage/5);
if(surah>114) surah=114;
let s=String(surah).padStart(3,'0');
audio.src=`https://everyayah.com/data/${reciter}/${s}001.mp3`;
audio.play();
}

// تحميل آخر صفحة محفوظة
let saved=localStorage.getItem("lastPage");
if(saved){currentPage=parseInt(saved);}
loadPage();

// مواقيت الصلاة
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(pos=>{
fetch(`https://api.aladhan.com/v1/timings?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&method=5`)
.then(r=>r.json())
.then(d=>{
let t=d.data.timings;
document.getElementById("prayerTimes").innerHTML=
`الفجر: ${t.Fajr}<br>
الظهر: ${t.Dhuhr}<br>
العصر: ${t.Asr}<br>
المغرب: ${t.Maghrib}<br>
العشاء: ${t.Isha}`;
});
});
}

</script>

</body>
</html>
