<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم - عرض تفاعلي</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#0f172a;
  color:#fff;
  font-family:"Amiri", serif;
  min-height:100vh;
}

header{
  text-align:center;
  padding:20px;
  background:#111827;
  border-bottom:1px solid #1f2937;
}

header h1{
  font-family:"Cairo", sans-serif;
  font-size:22px;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  padding:15px;
  background:#0b1220;
}

select,button,a{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  font-family:"Cairo", sans-serif;
  cursor:pointer;
  text-decoration:none;
  text-align:center;
}

button{
  background:#facc15;
  font-weight:bold;
}

.download-btn{
  background:#22c55e;
  color:#fff;
}

.frame{
  max-width:950px;
  margin:30px auto;
  padding:20px;
  background:#111;
  border:6px solid #d4af37;
  border-radius:15px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.quran-text{
  line-height:2.3;
  font-size:26px;
}

.ayah{
  cursor:pointer;
  padding:5px;
  border-radius:6px;
  transition:.3s;
}

.ayah:hover{
  background:rgba(250,204,21,.15);
}

.ayah.active{
  background:rgba(250,204,21,.3);
}

audio{
  width:100%;
  margin-top:20px;
}

@media(max-width:768px){
  .quran-text{font-size:20px}
}
</style>
</head>

<body>

<header>
  <h1>📖 القرآن الكريم</h1>
</header>

<div class="controls">
  <button onclick="prevSurah()">⮕ السورة السابقة</button>

  <select id="surahSelect"></select>

  <button onclick="nextSurah()">السورة التالية ⮔</button>

  <select id="reciterSelect">
    <option value="Alafasy_128kbps">مشاري العفاسي</option>
    <option value="Abdurrahmaan_As-Sudais_128kbps">السديس</option>
    <option value="Maher_AlMuaiqly_128kbps">ماهر المعيقلي</option>
    <option value="Husary_128kbps">الحصري</option>
  </select>

  <a id="downloadBtn" class="download-btn" download>⬇ تحميل السورة</a>
</div>

<div class="frame">
  <div id="quranText" class="quran-text">
    اختر سورة للعرض...
  </div>
</div>

<audio id="audioPlayer" controls></audio>

<script>
const surahSelect = document.getElementById("surahSelect");
const quranText = document.getElementById("quranText");
const audioPlayer = document.getElementById("audioPlayer");
const reciterSelect = document.getElementById("reciterSelect");
const downloadBtn = document.getElementById("downloadBtn");

let currentSurahData = [];

// تحميل أسماء السور
fetch("https://api.alquran.cloud/v1/surah")
.then(res=>res.json())
.then(data=>{
  data.data.forEach(surah=>{
    let option = document.createElement("option");
    option.value = surah.number;
    option.textContent = surah.number + " - " + surah.name;
    surahSelect.appendChild(option);
  });
  loadSurah();
});

// تحميل السورة
function loadSurah(){
  const surahNumber = surahSelect.value;
  quranText.innerHTML="جاري التحميل...";

  fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}`)
  .then(res=>res.json())
  .then(data=>{
    currentSurahData = data.data.ayahs;
    renderAyahs(currentSurahData);
    updateDownloadLink();
  });
}

// عرض الآيات
function renderAyahs(ayahs){
  quranText.innerHTML="";
  ayahs.forEach((ayah,index)=>{
    let span=document.createElement("span");
    span.classList.add("ayah");
    span.innerHTML=ayah.text+" ﴿"+ayah.numberInSurah+"﴾ ";
    span.onclick=()=>playAyah(index);
    quranText.appendChild(span);
  });
}

// تشغيل آية
function playAyah(index){
  const reciter = reciterSelect.value;
  const surah = surahSelect.value;
  const ayahNumber = currentSurahData[index].numberInSurah;

  document.querySelectorAll(".ayah").forEach(a=>a.classList.remove("active"));
  document.querySelectorAll(".ayah")[index].classList.add("active");

  const paddedSurah = surah.padStart(3,'0');
  const paddedAyah = ayahNumber.toString().padStart(3,'0');

  audioPlayer.src=`https://everyayah.com/data/${reciter}/${paddedSurah}${paddedAyah}.mp3`;
  audioPlayer.play();
}

// تحديث رابط التحميل
function updateDownloadLink(){
  const surah = surahSelect.value.padStart(3,'0');
  const reciter = reciterSelect.value;
  downloadBtn.href=`https://everyayah.com/data/${reciter}/${surah}001.mp3`;
}

// السابق / التالي
function nextSurah(){
  if(surahSelect.value<114){
    surahSelect.value=parseInt(surahSelect.value)+1;
    loadSurah();
  }
}

function prevSurah(){
  if(surahSelect.value>1){
    surahSelect.value=parseInt(surahSelect.value)-1;
    loadSurah();
  }
}

surahSelect.addEventListener("change",loadSurah);
reciterSelect.addEventListener("change",updateDownloadLink);
</script>

</body>
</html>
