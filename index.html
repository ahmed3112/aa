<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصحف الشريف 604 صفحة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#0b1c2d;
font-family:'Cairo',sans-serif;
color:white;
text-align:center;
transition:.3s;
}

header{
padding:20px;
background:linear-gradient(135deg,#0b1c2d,#102c44);
font-size:22px;
}

.container{
margin:20px auto;
max-width:1000px;
background:#162f4a;
padding:20px;
border-radius:15px;
box-shadow:0 0 25px rgba(0,0,0,.6);
}

.frame{
background:black;
padding:15px;
border-radius:15px;
display:inline-block;
overflow:hidden;
}

.frame img{
width:100%;
max-width:900px;
border-radius:10px;
transition:.3s;
}

.controls{
margin:15px 0;
}

button,select{
padding:8px 15px;
margin:5px;
border:none;
border-radius:8px;
font-family:'Cairo';
}

button{
background:#f4c430;
font-weight:bold;
cursor:pointer;
}

button:hover{opacity:.85}

audio{
margin-top:15px;
width:95%;
max-width:650px;
}

.page-info{
margin-top:10px;
font-size:18px;
}

.prayer-box{
margin-top:25px;
padding:15px;
background:#203c5c;
border-radius:10px;
}

.light{
background:#f5f5f5;
color:black;
}

.light .container{
background:white;
color:black;
}
</style>
</head>

<body>

<header>
📖 المصحف الشريف – 604 صفحة كاملة
</header>

<div class="container">

<div class="controls">
<select id="reciter">
<option value="Alafasy_128kbps">مشاري العفاسي</option>
<option value="Abdurrahmaan_As-Sudais_128kbps">السديس (الحرم)</option>
<option value="Maher_AlMuaiqly_128kbps">ماهر المعيقلي (الحرم)</option>
<option value="Husary_128kbps">الحصري (مصر)</option>
<option value="Minshawy_Murattal_128kbps">المنشاوي (مصر)</option>
</select>

<button onclick="prevPage()">⬅ السابق</button>
<button onclick="nextPage()">التالي ➡</button>
<button onclick="playSurah()">🔊 تشغيل</button>
<button onclick="toggleMode()">🌙 / ☀</button>
</div>

<div class="frame">
<img id="moshafPage">
</div>

<div class="controls">
<button onclick="zoomIn()">تكبير +</button>
<button onclick="zoomOut()">تصغير -</button>
</div>

<div class="page-info">
الصفحة: <span id="pageNumber">1</span> / 604
</div>

<audio id="audioPlayer" controls></audio>

<div class="prayer-box">
<h3>🕌 مواعيد الصلاة</h3>
<div id="prayerTimes">جاري تحميل المواقيت...</div>
</div>

</div>

<script>

let currentPage = 1;
let zoomLevel = 1;
const totalPages = 604;
const img = document.getElementById("moshafPage");
const pageNumber = document.getElementById("pageNumber");
const audio = document.getElementById("audioPlayer");

// تحميل صفحة (مصدر ثابت شغال)
function loadPage(){
let formatted = String(currentPage).padStart(3,'0');
img.src = `https://everyayah.com/data/quranpngs/page${formatted}.png`;
pageNumber.textContent = currentPage;
localStorage.setItem("lastPage",currentPage);
}

function nextPage(){
if(currentPage < totalPages){
currentPage++;
loadPage();
}
}

function prevPage(){
if(currentPage > 1){
currentPage--;
loadPage();
}
}

// ربط الصفحة بالسورة بدقة تقريبية محسنة
function getSurah(page){
const map=[1,2,50,77,106,128,151,177,187,208,221,235,249,255,262,267,282,293,305,312,
322,332,342,350,359,367,377,385,396,404,411,415,418,428,434,440,446,453,
458,467,477,483,489,496,499,502,507,511,515,518,520,523,526,528,531,534,
537,542,545,549,551,553,554,556,558,560,562,564,566,568,570,572,574,575,
577,578,580,582,583,585,586,587,589,590,591,592,593,594,595,596,597,598,
599,600,601,601,602,602,603,603,604,604,604,604,604,604,604,604,604,604,
604,604,604,604,604,604];
for(let i=0;i<map.length;i++){
if(page<map[i]) return i;
}
return 114;
}

function playSurah(){
let reciter=document.getElementById("reciter").value;
let surah=getSurah(currentPage);
let s=String(surah).padStart(3,'0');
audio.src=`https://everyayah.com/data/${reciter}/${s}001.mp3`;
audio.play();
}

function zoomIn(){
zoomLevel+=0.1;
img.style.transform=`scale(${zoomLevel})`;
}

function zoomOut(){
zoomLevel-=0.1;
img.style.transform=`scale(${zoomLevel})`;
}

function toggleMode(){
document.body.classList.toggle("light");
}

// Swipe Mobile
let startX=0;
img.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
img.addEventListener("touchend",e=>{
let diff=e.changedTouches[0].clientX-startX;
if(diff>50) prevPage();
if(diff<-50) nextPage();
});

// تحميل آخر صفحة
let saved=localStorage.getItem("lastPage");
if(saved){currentPage=parseInt(saved);}
loadPage();

// مواقيت الصلاة
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(pos=>{
fetch(`https://api.aladhan.com/v1/timings?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&method=5`)
.then(r=>r.json())
.then(d=>{
let t=d.data.timings;
document.getElementById("prayerTimes").innerHTML=
`الفجر: ${t.Fajr}<br>
الظهر: ${t.Dhuhr}<br>
العصر: ${t.Asr}<br>
المغرب: ${t.Maghrib}<br>
العشاء: ${t.Isha}`;
});
});
}

</script>

</body>
</html>
