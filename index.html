<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصحف الشريف</title>

<style>
body{
  margin:0;
  font-family:Tahoma;
  background:#0b1c2d;
  text-align:center;
  color:white;
}

header{
  padding:20px;
  font-size:24px;
  background:#102c44;
}

#moshaf-container{
  margin-top:20px;
}

img{
  width:95%;
  max-width:800px;
  border-radius:10px;
  box-shadow:0 0 20px rgba(0,0,0,0.6);
}

.controls{
  margin:20px;
}

button{
  padding:10px 20px;
  margin:5px;
  font-size:16px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#f4c430;
  font-weight:bold;
}

button:hover{
  opacity:0.8;
}

select{
  padding:8px;
  border-radius:6px;
  margin:10px;
}

audio{
  margin-top:15px;
  width:90%;
  max-width:600px;
}
</style>
</head>

<body>

<header>
📖 المصحف الشريف – صفحات كاملة
</header>

<div class="controls">

<select id="reciter">
<option value="ar.alafasy">مشاري العفاسي</option>
<option value="ar.abdurrahmaansudais">السديس</option>
<option value="ar.mahermuaiqly">ماهر المعيقلي</option>
</select>

<button onclick="prevPage()">⬅ السابق</button>
<button onclick="nextPage()">التالي ➡</button>

</div>

<div id="moshaf-container">
<img id="pageImage" src="">
</div>

<div>
<p>الصفحة: <span id="pageNumber">1</span> / 604</p>
<audio id="audioPlayer" controls></audio>
</div>

<script>
let currentPage = 1;
const totalPages = 604;
const pageImage = document.getElementById("pageImage");
const pageNumber = document.getElementById("pageNumber");
const audioPlayer = document.getElementById("audioPlayer");

function loadPage(){
pageImage.src = `https://api.alquran.cloud/v1/page/${currentPage}/quran-uthmani`;
pageNumber.textContent = currentPage;
}

function nextPage(){
if(currentPage < totalPages){
currentPage++;
loadPage();
}
}

function prevPage(){
if(currentPage > 1){
currentPage--;
loadPage();
}
}

function playPage(){
let reciter = document.getElementById("reciter").value;
audioPlayer.src = `https://cdn.islamic.network/quran/audio-surah/128/${reciter}/1.mp3`;
audioPlayer.play();
}

loadPage();
</script>

</body>
</html>
