<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصحف الشريف - عرض احترافي</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Cairo",sans-serif}

body{
  background:#0f172a;
  color:#fff;
  min-height:100vh;
  text-align:center;
}

/* Header */
header{
  padding:20px;
  background:#111827;
  border-bottom:1px solid #1f2937;
}

header h1{
  font-size:22px;
}

/* Controls */
.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  padding:15px;
  background:#0b1220;
}

button,select,input,a{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  cursor:pointer;
  font-weight:600;
  text-decoration:none;
}

button{
  background:#facc15;
}

.download-btn{
  background:#22c55e;
  color:#fff;
}

/* Frame */
.mushaf-frame{
  margin:30px auto;
  max-width:800px;
  padding:15px;
  border:8px solid #d4af37;
  border-radius:15px;
  background:#000;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.mushaf-frame img{
  width:100%;
  border-radius:8px;
}

.page-info{
  margin-top:15px;
  font-size:18px;
}

audio{
  margin:20px auto;
  width:90%;
  max-width:600px;
}

@media(max-width:768px){
  .mushaf-frame{margin:15px}
}
</style>
</head>

<body>

<header>
  <h1>📖 المصحف الشريف - 604 صفحة</h1>
</header>

<div class="controls">

  <button onclick="prevPage()">⮕ الصفحة السابقة</button>

  <input type="number" id="pageInput" min="1" max="604" value="1">

  <button onclick="goToPage()">اذهب</button>

  <button onclick="nextPage()">الصفحة التالية ⮔</button>

  <select id="reciterSelect">
    <option value="afasy">مشاري العفاسي</option>
    <option value="sudais">السديس</option>
    <option value="maher">ماهر المعيقلي</option>
    <option value="husary">الحصري</option>
  </select>

  <button onclick="playSurah()">تشغيل السورة كاملة</button>

  <a id="downloadBtn" class="download-btn" download>⬇ تحميل السورة</a>

</div>

<div class="mushaf-frame">
  <img id="mushafImage" src="https://quran.ksu.edu.sa/png_big/1.png">
  <div class="page-info">
    الصفحة: <span id="pageNumber">1</span> / 604
  </div>
</div>

<audio id="audioPlayer" controls></audio>

<script>
let currentPage = 1;
let currentSurah = 1;

const pageInput = document.getElementById("pageInput");
const mushafImage = document.getElementById("mushafImage");
const pageNumber = document.getElementById("pageNumber");
const reciterSelect = document.getElementById("reciterSelect");
const audioPlayer = document.getElementById("audioPlayer");
const downloadBtn = document.getElementById("downloadBtn");

// تحديث الصفحة
function updatePage(){
  if(currentPage < 1) currentPage = 1;
  if(currentPage > 604) currentPage = 604;

  mushafImage.src = "https://quran.ksu.edu.sa/png_big/" + currentPage + ".png";
  pageNumber.innerText = currentPage;
  pageInput.value = currentPage;

  // تقريبياً تحديد السورة حسب الصفحة
  currentSurah = getSurahFromPage(currentPage);
  updateDownloadLink();
}

function nextPage(){ currentPage++; updatePage(); }
function prevPage(){ currentPage--; updatePage(); }
function goToPage(){
  currentPage = parseInt(pageInput.value);
  updatePage();
}

// تقريب توزيع الصفحات على السور
function getSurahFromPage(page){
  return Math.ceil((page/604)*114);
}

// تشغيل السورة كاملة
function playSurah(){
  const reciter = reciterSelect.value;
  const surah = currentSurah.toString().padStart(3,'0');

  audioPlayer.src = getFullSurahLink(reciter, surah);
  audioPlayer.play();
}

// روابط تحميل كاملة
function getFullSurahLink(reciter, surah){
  const links = {
    afasy: `https://server8.mp3quran.net/afs/${surah}.mp3`,
    sudais: `https://server11.mp3quran.net/sds/${surah}.mp3`,
    maher: `https://server12.mp3quran.net/maher/${surah}.mp3`,
    husary: `https://server13.mp3quran.net/husr/${surah}.mp3`
  };
  return links[reciter];
}

function updateDownloadLink(){
  const reciter = reciterSelect.value;
  const surah = currentSurah.toString().padStart(3,'0');
  downloadBtn.href = getFullSurahLink(reciter, surah);
}

reciterSelect.addEventListener("change", updateDownloadLink);

updatePage();
</script>

</body>
</html>
