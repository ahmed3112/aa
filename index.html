<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#d4af37">

<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#ffffff;
  font-family:"Amiri Quran",serif;
  color:#222;
}

header{
  padding:15px;
  display:flex;
  gap:10px;
  justify-content:center;
  border-bottom:1px solid #eee;
}

button,input{
  padding:6px 12px;
  border-radius:8px;
  border:1px solid #ddd;
  cursor:pointer;
}

button{
  background:#0f766e;
  color:#fff;
  border:none;
}

.wrapper{
  display:flex;
  justify-content:center;
  margin:40px 20px;
}

.frame{
  max-width:950px;
  width:100%;
  background:#fffef9;
  border-radius:20px;
  padding:40px;
  border:8px solid #d4af37;
  box-shadow:0 20px 50px rgba(0,0,0,0.15);
}

.title{
  text-align:center;
  font-weight:bold;
  font-size:18px;
}

.sub{
  text-align:center;
  margin-top:5px;
}

.basmala{
  text-align:center;
  font-size:30px;
  margin:25px 0;
}

.text{
  font-size:30px;
  line-height:2.5;
  text-align:justify;
}

.page-num{
  text-align:center;
  margin-top:20px;
}
</style>
</head>

<body>

<header>
<button onclick="prevPage()">⮕ السابقة</button>
<input type="number" id="pageInput" min="1" max="604">
<button onclick="goToPage()">اذهب</button>
<button onclick="nextPage()">التالية ⮔</button>
</header>

<div class="wrapper">
<div class="frame">

<div class="title" id="pageTitle"></div>
<div class="sub" id="surahName"></div>
<div class="sub" id="juzName"></div>
<div class="basmala" id="basmala"></div>

<div class="text" id="quranText"></div>

<div class="page-num" id="pageNumber"></div>

</div>
</div>

<script>
// ====== SERVICE WORKER ======
if ('serviceWorker' in navigator) {
 window.addEventListener('load', () => {
  navigator.serviceWorker.register('./sw.js');
 });
}

let currentPage = localStorage.getItem("lastPage") || 1;

const quranText = document.getElementById("quranText");
const surahName = document.getElementById("surahName");
const juzName = document.getElementById("juzName");
const basmala = document.getElementById("basmala");
const pageTitle = document.getElementById("pageTitle");
const pageNumber = document.getElementById("pageNumber");
const pageInput = document.getElementById("pageInput");

function loadPage(){
 localStorage.setItem("lastPage", currentPage);
 pageInput.value = currentPage;

 fetch(`https://api.alquran.cloud/v1/page/${currentPage}/quran-uthmani`)
 .then(r => r.json())
 .then(data => {

  quranText.innerHTML="";
  basmala.innerHTML="";

  const ayahs = data.data.ayahs;
  const first = ayahs[0];

  pageTitle.innerText = "الصفحة " + currentPage;
  pageNumber.innerText = currentPage + " / 604";
  surahName.innerText = first.surah.name;
  juzName.innerText = "الجزء " + first.juz;

  let cleanAyahs = [...ayahs];

  // === إزالة البسملة صح 100% ===
  if(first.numberInSurah === 1 && first.surah.number !== 9){
    basmala.innerText = "بِسْمِ ٱللّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ";
    cleanAyahs[0].text = cleanAyahs[0].text.replace(/^بِسْمِ.*?ٱلرَّحِيمِ\s*/,'');
  }

  cleanAyahs.forEach(a=>{
    let span = document.createElement("span");
    span.innerHTML = a.text.trim() + " ﴿" + a.numberInSurah + "﴾ ";
    quranText.appendChild(span);
  });

 });
}

function nextPage(){ if(currentPage<604){currentPage++;loadPage();}}
function prevPage(){ if(currentPage>1){currentPage--;loadPage();}}
function goToPage(){ currentPage=parseInt(pageInput.value);loadPage(); }

loadPage();
</script>

</body>
</html>
