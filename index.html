<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم - تلاوة تفاعلية</title>

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#0f172a;
  color:#fff;
  font-family:"Amiri", serif;
  min-height:100vh;
}

header{
  padding:20px;
  text-align:center;
  background:#111827;
  border-bottom:1px solid #1f2937;
}

header h1{
  font-family:"Cairo", sans-serif;
  font-size:22px;
}

.controls{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  padding:15px;
  background:#0b1220;
}

select,button{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  font-family:"Cairo", sans-serif;
  cursor:pointer;
}

button{
  background:#facc15;
  font-weight:bold;
}

.quran-container{
  max-width:900px;
  margin:30px auto;
  padding:25px;
  line-height:2.3;
  font-size:28px;
}

.ayah{
  cursor:pointer;
  padding:6px 4px;
  transition:.3s;
  border-radius:6px;
}

.ayah:hover{
  background:rgba(250,204,21,0.15);
}

.ayah.active{
  background:rgba(250,204,21,0.3);
}

audio{
  width:100%;
  margin-top:20px;
}

.loading{
  text-align:center;
  margin-top:40px;
  opacity:.7;
}

@media(max-width:768px){
  .quran-container{
    font-size:22px;
    padding:15px;
  }
}
</style>
</head>

<body>

<header>
  <h1>📖 القرآن الكريم - استماع تفاعلي</h1>
</header>

<div class="controls">
  <select id="surahSelect"></select>

  <select id="reciterSelect">
    <option value="Alafasy_128kbps">مشاري العفاسي</option>
    <option value="Abdurrahmaan_As-Sudais_128kbps">السديس</option>
    <option value="Maher_AlMuaiqly_128kbps">ماهر المعيقلي</option>
    <option value="Husary_128kbps">الحصري</option>
  </select>

  <button onclick="loadSurah()">تحميل السورة</button>
</div>

<div class="quran-container" id="quranText">
  <div class="loading">اختر سورة لعرض النص...</div>
</div>

<audio id="audioPlayer" controls></audio>

<script>
const surahSelect = document.getElementById("surahSelect");
const quranText = document.getElementById("quranText");
const audioPlayer = document.getElementById("audioPlayer");
const reciterSelect = document.getElementById("reciterSelect");

let currentSurahData = [];

// تحميل أسماء السور
fetch("https://api.alquran.cloud/v1/surah")
.then(res=>res.json())
.then(data=>{
  data.data.forEach(surah=>{
    let option = document.createElement("option");
    option.value = surah.number;
    option.textContent = surah.number + " - " + surah.name;
    surahSelect.appendChild(option);
  });
});

// تحميل السورة
function loadSurah(){
  const surahNumber = surahSelect.value;
  quranText.innerHTML = "<div class='loading'>جاري التحميل...</div>";

  fetch(`https://api.alquran.cloud/v1/surah/${surahNumber}/ar.alafasy`)
  .then(res=>res.json())
  .then(data=>{
    currentSurahData = data.data.ayahs;
    renderAyahs(data.data.ayahs);
  });
}

// عرض الآيات
function renderAyahs(ayahs){
  quranText.innerHTML = "";

  ayahs.forEach((ayah,index)=>{
    let span = document.createElement("span");
    span.classList.add("ayah");
    span.innerHTML = ayah.text + " ﴿" + ayah.numberInSurah + "﴾ ";
    span.onclick = ()=> playAyah(index);
    quranText.appendChild(span);
  });
}

// تشغيل آية
function playAyah(index){
  const reciter = reciterSelect.value;
  const surah = surahSelect.value;
  const ayahNumber = currentSurahData[index].numberInSurah;

  document.querySelectorAll(".ayah").forEach(a=>a.classList.remove("active"));
  document.querySelectorAll(".ayah")[index].classList.add("active");

  const paddedSurah = surah.padStart(3,'0');
  const paddedAyah = ayahNumber.toString().padStart(3,'0');

  audioPlayer.src = `https://everyayah.com/data/${reciter}/${paddedSurah}${paddedAyah}.mp3`;
  audioPlayer.play();
}
</script>

</body>
</html>
