<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصحف Ultra Elite Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Amiri+Quran&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Cairo',sans-serif;
background:#0b1c2d;
color:white;
transition:.3s;
}

header{
text-align:center;
padding:25px;
background:linear-gradient(135deg,#0b1c2d,#102c44);
}

.card{
background:#162f4a;
margin:20px auto;
padding:25px;
border-radius:15px;
max-width:1200px;
}

.controls{text-align:center;margin-bottom:15px}

select,button,input{
padding:8px 12px;
margin:5px;
border-radius:8px;
border:none;
font-family:'Cairo';
}

button{
background:#f4c430;
cursor:pointer;
font-weight:bold;
}

#ayahContainer{
font-family:'Amiri Quran';
font-size:28px;
line-height:2.4;
margin-top:20px;
}

#ayahContainer p{
padding:6px;
border-radius:8px;
cursor:pointer;
transition:.2s;
}

#ayahContainer p:hover{background:#203c5c}

.activeAyah{background:#f4c430;color:black}

audio{width:100%;margin-top:15px}

.progress{
height:6px;
background:#444;
border-radius:5px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
height:100%;
width:0%;
background:#f4c430;
}

.prayer-box{
margin-top:25px;
padding:15px;
background:#203c5c;
border-radius:10px;
}

.light{background:#f5f5f5;color:black}
.light .card{background:white;color:black}
.light #ayahContainer p:hover{background:#eee}
</style>
</head>

<body>

<header>
<h1>📖 المصحف Ultra Elite Pro</h1>
</header>

<section class="card">

<div class="controls">
<select id="reciterSelect"></select>
<select id="surahSelect"></select>
<input type="text" id="searchInput" placeholder="بحث داخل السورة">
<button onclick="loadSurah()">تحميل السورة</button>
<button onclick="toggleAuto()">Auto</button>
<button onclick="downloadSurah()">تحميل MP3</button>
</div>

<div id="ayahContainer"></div>

<div class="progress"><div class="progress-bar" id="progressBar"></div></div>

<audio id="audio" controls></audio>

<div class="prayer-box">
<h3>🕌 مواعيد الصلاة</h3>
<div id="prayerTimes">جاري تحميل المواقيت...</div>
</div>

</section>

<script>
const reciters=[
{name:"العفاسي",id:"Alafasy_128kbps"},
{name:"السديس (الحرم)",id:"Abdurrahmaan_As-Sudais_128kbps"},
{name:"المعيقلي (الحرم)",id:"Maher_AlMuaiqly_128kbps"},
{name:"الحصري (مصر)",id:"Husary_128kbps"},
{name:"المنشاوي (مصر)",id:"Minshawy_Murattal_128kbps"}
];

const reciterSelect=document.getElementById("reciterSelect");
const surahSelect=document.getElementById("surahSelect");
const ayahContainer=document.getElementById("ayahContainer");
const audio=document.getElementById("audio");
const progressBar=document.getElementById("progressBar");

let currentSurah=1;
let ayahs=[];
let autoPlay=false;
let currentAyahIndex=0;

reciters.forEach(r=>{
let o=document.createElement("option");
o.value=r.id;
o.textContent=r.name;
reciterSelect.appendChild(o);
});

fetch("https://api.alquran.cloud/v1/surah")
.then(r=>r.json())
.then(d=>{
d.data.forEach(s=>{
let o=document.createElement("option");
o.value=s.number;
o.textContent=s.number+" - "+s.name;
surahSelect.appendChild(o);
});
});

function loadSurah(){
currentSurah=surahSelect.value;
fetch(`https://api.alquran.cloud/v1/surah/${currentSurah}/quran-uthmani`)
.then(r=>r.json())
.then(d=>{
ayahs=d.data.ayahs;
renderSurah();
});
}

function renderSurah(){
ayahContainer.innerHTML="";
ayahs.forEach((a,i)=>{
let p=document.createElement("p");
p.innerHTML=a.text+" ﴿"+a.numberInSurah+"﴾";
p.onclick=()=>playAyah(i,p);
ayahContainer.appendChild(p);
});
}

function playAyah(index,element){
currentAyahIndex=index;
let reciter=reciterSelect.value;
let surah=String(currentSurah).padStart(3,'0');
let ayah=String(ayahs[index].numberInSurah).padStart(3,'0');

audio.src=`https://everyayah.com/data/${reciter}/${surah}${ayah}.mp3`;
audio.play();

document.querySelectorAll("#ayahContainer p").forEach(p=>p.classList.remove("activeAyah"));
if(element) element.classList.add("activeAyah");
}

audio.onended=function(){
if(autoPlay && currentAyahIndex+1<ayahs.length){
currentAyahIndex++;
playAyah(currentAyahIndex);
}
}

audio.ontimeupdate=function(){
if(audio.duration){
let percent=(audio.currentTime/audio.duration)*100;
progressBar.style.width=percent+"%";
}
}

function toggleAuto(){
autoPlay=!autoPlay;
}

function downloadSurah(){
let reciter=reciterSelect.value;
let surah=String(currentSurah).padStart(3,'0');
window.open(`https://everyayah.com/data/${reciter}/${surah}001.mp3`);
}

document.getElementById("searchInput").addEventListener("input",function(){
let value=this.value;
document.querySelectorAll("#ayahContainer p").forEach(p=>{
p.style.display=p.textContent.includes(value)?"block":"none";
});
});

// 🕌 Prayer Times
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(pos=>{
let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=5`)
.then(r=>r.json())
.then(d=>{
let t=d.data.timings;
document.getElementById("prayerTimes").innerHTML=
`الفجر: ${t.Fajr}<br>
الظهر: ${t.Dhuhr}<br>
العصر: ${t.Asr}<br>
المغرب: ${t.Maghrib}<br>
العشاء: ${t.Isha}`;
});
});
}
</script>

</body>
</html>
